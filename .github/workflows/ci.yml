name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install root deps
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Install web deps
        working-directory: ./web
        run: npm ci
      - name: Build web
        working-directory: ./web
        run: npm run build
